<section class="contact-page">
  <div class="container">
    <div class="contact-card">
      <div class="contact-info">
        <h2>Get in Touch</h2>
        <p>Have questions about your order or need support? We're here to help.</p>
        <div class="info-items">
          <div class="info-item">
            <span class="icon">📍</span>
            <span> NeST Information Technologies, Infopark Road, Logistic Park, Kakkanad, Edachira, Kochi, Kerala</span>
          </div>
          <div class="info-item">
            <span class="icon">📞</span>
            <span> 0484 420 3333</span>
          </div>
          <div class="info-item">
            <span class="icon">✉️</span>
            <span> sales.nestdigital@nestgroup.net </span>
          </div>
        </div>
      </div>
      <form class="contact-form">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" placeholder="John Doe">
        </div>
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" placeholder="john@example.com">
        </div>
        <div class="form-group">
          <label>Message</label>
          <textarea rows="5" placeholder="How can we help?"></textarea>
        </div>
        <button type="submit" class="btn-primary">Send Message</button>
      </form>
    </div>
  </div>
</section>
